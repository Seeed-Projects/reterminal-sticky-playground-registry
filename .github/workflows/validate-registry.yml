name: Validate Registry

on:
  pull_request:
    paths:
      - "firmwares/**"
      - "printables/**"
      - "examples/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-registry.yml"
  push:
    branches:
      - main
    paths:
      - "firmwares/**"
      - "printables/**"
      - "examples/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate firmware and printable metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validator tests
        run: npm test

      - name: Validate registry
        run: npm run validate

  discover-firmware:
    name: Discover source builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      channels: ${{ steps.channels.outputs.run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect changed files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "files<<CHANGED_FILES_EOF"
            git diff --name-only "$BASE_SHA" HEAD
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read build targets
        id: targets
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: echo "matrix=$(node scripts/list-build-targets.mjs)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to smoke test the build channels
        id: channels
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          PIPELINE_PATHS='^(scripts/|examples/|package(-lock)?\.json|\.github/workflows/validate-registry\.yml)'
          if [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -qE "$PIPELINE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-firmware:
    name: Build ${{ matrix.id }}
    needs:
      - validate
      - discover-firmware
    if: ${{ needs.discover-firmware.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-firmware.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build ESP-IDF project
        if: ${{ matrix.system == 'esp-idf' }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idfVersion }}
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: idf.py -D PROJECT_VER=${{ matrix.version }} build

      - name: Set up Python
        if: ${{ matrix.system == 'platformio' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build PlatformIO project
        if: ${{ matrix.system == 'platformio' }}
        env:
          PLATFORMIO_EXTRA_SCRIPTS: post:${{ github.workspace }}/scripts/pio-dump-flash-args.py
        run: |
          pip install --upgrade platformio
          pio run -d "${{ matrix.path }}" -e "${{ matrix.environment }}"

      - name: Set up Arduino CLI
        if: ${{ matrix.system == 'arduino' }}
        uses: arduino/setup-arduino-cli@v2

      - name: Build Arduino sketch
        if: ${{ matrix.system == 'arduino' }}
        run: |
          arduino-cli compile \
            --profile "${{ matrix.profile }}" \
            --build-path "${{ matrix.path }}/build" \
            "${{ matrix.path }}"

      - name: Package firmware
        env:
          FIRMWARE_OUTPUT_DIR: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}
          REGISTRY_COMMIT: ${{ github.sha }}
        run: npm run "package:${{ matrix.system }}" -- "${{ matrix.id }}" "${{ matrix.version }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}-${{ matrix.versionSlug }}
          path: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}
          if-no-files-found: error
          retention-days: 7

  verify-build-channels:
    name: Smoke test the ${{ matrix.system }} channel
    needs:
      - validate
      - discover-firmware
    if: ${{ needs.discover-firmware.outputs.channels == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system:
          - platformio
          - arduino

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        if: ${{ matrix.system == 'platformio' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        if: ${{ matrix.system == 'platformio' }}
        run: pip install --upgrade platformio

      - name: Set up Arduino CLI
        if: ${{ matrix.system == 'arduino' }}
        uses: arduino/setup-arduino-cli@v2

      - name: Cache toolchain downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.arduino15
          key: build-channel-${{ matrix.system }}-${{ hashFiles('examples/platformio-starter/platformio.ini', 'examples/arduino-starter/sketch.yaml') }}

      - name: Build and package the starter project
        run: node scripts/verify-build-channel.mjs "${{ matrix.system }}"

  publish-firmware:
    name: Publish ${{ matrix.id }} ${{ matrix.version }}
    needs:
      - discover-firmware
      - build-firmware
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover-firmware.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-firmware.outputs.matrix) }}

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.id }}-${{ matrix.versionSlug }}
          path: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: registry-${{ matrix.id }}-${{ matrix.versionSlug }}
          RELEASE_TITLE: ${{ matrix.name }} ${{ matrix.version }}
          OUTPUT_DIR: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" "$OUTPUT_DIR"/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Source-built firmware generated from Registry commit $GITHUB_SHA."
          fi
