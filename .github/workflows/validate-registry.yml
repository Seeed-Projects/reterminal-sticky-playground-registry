name: Validate Registry

on:
  pull_request:
    paths:
      - "firmwares/**"
      - "printables/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-registry.yml"
  push:
    branches:
      - main
    paths:
      - "firmwares/**"
      - "printables/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate firmware and printable metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validator tests
        run: npm test

      - name: Validate registry
        run: npm run validate

  discover-firmware:
    name: Discover source builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect changed files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "files<<CHANGED_FILES_EOF"
            git diff --name-only "$BASE_SHA" HEAD
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read build targets
        id: targets
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: echo "matrix=$(node scripts/list-build-targets.mjs)" >> "$GITHUB_OUTPUT"

  build-firmware:
    name: Build ${{ matrix.id }}
    needs:
      - validate
      - discover-firmware
    if: ${{ needs.discover-firmware.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-firmware.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build ESP-IDF project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idfVersion }}
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: idf.py -D PROJECT_VER=${{ matrix.version }} build

      - name: Package firmware
        env:
          FIRMWARE_OUTPUT_DIR: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}
          REGISTRY_COMMIT: ${{ github.sha }}
        run: npm run package:esp-idf -- "${{ matrix.id }}" "${{ matrix.version }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}-${{ matrix.versionSlug }}
          path: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}
          if-no-files-found: error
          retention-days: 7

  publish-firmware:
    name: Publish ${{ matrix.id }} ${{ matrix.version }}
    needs:
      - discover-firmware
      - build-firmware
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover-firmware.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-firmware.outputs.matrix) }}

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.id }}-${{ matrix.versionSlug }}
          path: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: registry-${{ matrix.id }}-${{ matrix.versionSlug }}
          RELEASE_TITLE: ${{ matrix.name }} ${{ matrix.version }}
          OUTPUT_DIR: firmware-output/${{ matrix.id }}/${{ matrix.versionSlug }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" "$OUTPUT_DIR"/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Source-built firmware generated from Registry commit $GITHUB_SHA."
          fi
