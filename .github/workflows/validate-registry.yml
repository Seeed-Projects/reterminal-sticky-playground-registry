name: Validate Registry

on:
  pull_request:
    paths:
      - "integrations/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-registry.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate integration metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validator tests
        run: npm test

      - name: Validate registry
        run: npm run validate
